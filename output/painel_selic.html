<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Selic - BMA FIDC</title>
<style>

  :root {
    --primaria: #1B172D;   /* fundo escuro do site */
    --azul: #2B63DF;       /* botão "Área do cliente" */
    --azul-escuro: #253E8C;
    --laranja: #F37522;    /* laranja do logo */
    --texto: #202020;
    --fundo: #EDEDED;
    --cartao: #FFFFFF;
    --suave: #6B7080;
    --linha: #DADCE3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
         font-family: Averta, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; font-weight: 300; }
  header { background: var(--primaria); color: #fff; padding: 28px 48px 30px; }
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .logo svg { height: 46px; width: auto; display: block; }
  .selo { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
          padding: 8px 14px; background: var(--azul); color: #fff; }
  .selo.contingencia { background: var(--laranja); }
  h1 { font-weight: 400; font-size: 44px; letter-spacing: -1.5px; margin: 26px 0 4px; }
  h1 b { font-weight: 600; color: var(--laranja); }
  .sub { font-size: 17px; color: #C9CBD6; margin: 0; }
  .aviso { background: var(--laranja); color: #fff; font-weight: 600; padding: 12px 48px; font-size: 15px; }
  main { padding: 28px 48px 40px; max-width: 1500px; margin: 0 auto; }
  .filtros { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .filtros span { font-size: 13px; color: var(--suave); margin-right: 6px; }
  .filtros button { font: inherit; font-size: 13px; font-weight: 800; border: 0; cursor: pointer;
                    padding: 9px 16px; background: #fff; color: var(--primaria); }
  .filtros button.ativo { background: var(--azul); color: #fff; }
  .filtros input { font: inherit; font-size: 13px; padding: 7px 8px; border: 1px solid var(--linha); background: #fff; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 18px; }
  .kpi { background: var(--cartao); padding: 18px 20px; }
  .kpi .rot { font-size: 13px; color: var(--suave); }
  .kpi .val { font-size: 30px; font-weight: 600; letter-spacing: -1px; margin-top: 6px; color: var(--primaria); }
  .kpi .det { font-size: 12px; color: var(--suave); margin-top: 2px; }
  .kpi.destaque { background: var(--primaria); }
  .kpi.destaque .rot, .kpi.destaque .det { color: #C9CBD6; }
  .kpi.destaque .val { color: #fff; }
  .neg { color: var(--azul) !important; } .pos { color: var(--laranja) !important; }
  .grade { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
  .painel { background: var(--cartao); padding: 20px 22px; }
  .painel h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px; color: var(--primaria); letter-spacing: -.3px; }
  .painel p.leg { font-size: 12px; color: var(--suave); margin: 0 0 10px; }
  svg text { font-family: inherit; }
  .grafico { position: relative; }
  .dica { position: absolute; pointer-events: none; background: var(--primaria); color: #fff; font-size: 13px;
          padding: 8px 10px; white-space: nowrap; opacity: 0; transition: opacity .1s; }
  .dica b { color: var(--laranja); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
       color: #fff; background: var(--primaria); padding: 9px 10px; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--linha); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .vazio { color: var(--suave); font-size: 14px; padding: 12px 0; }
  .compara { margin-top: 22px; background: var(--fundo); padding: 16px 18px; }
  .compara .rot { font-size: 13px; color: var(--suave); }
  .compara .val { font-size: 28px; font-weight: 600; letter-spacing: -1px; color: var(--primaria); margin-top: 4px; }
  .compara .det { font-size: 13px; margin-top: 2px; }
  footer { font-size: 12px; color: var(--suave); padding: 0 48px 28px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, 1fr); } .grade { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { header, main, footer { padding-left: 16px; padding-right: 16px; } .aviso { padding: 12px 16px; }
                              .kpis { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 32px; } }
</style>
</head>

const inDe = document.getElementById("de"), inAte = document.getElementById("ate");
for (const i of [inDe, inAte]) { i.min = iso(primeiraData); i.max = iso(ultimaData); }

function filtrar(de, ate) { return pontos.filter(p => p.d >= de && p.d <= ate); }

function mudancas(ps) {
  const lista = [];
  for (let i = 1; i < ps.length; i++) if (ps[i].v !== ps[i - 1].v) lista.push({ d: ps[i].d, de: ps[i - 1].v, para: ps[i].v });
  return lista;
}

function kpis(ps, muds) {
  const vals = ps.map(p => p.v), pri = ps[0], ult = ps[ps.length - 1];
  const vpp = ult.v - pri.v, vpct = pri.v ? vpp / pri.v * 100 : 0;
  const media = vals.reduce((a, b) => a + b, 0) / vals.length;
  const sinal = x => (x > 0 ? "+" : "") + br(x);
  const cls = vpp < 0 ? "neg" : vpp > 0 ? "pos" : "";
  const cards = [

    ["", "Menor", br(Math.min(...vals)) + "%", "no período"],
    ["", "Média", br(media) + "%", ps.length + " observações"],
  ];

function eixoY(min, max) {
  const folga = Math.max((max - min) * 0.15, 0.1);
  let a = min - folga, b = max + folga;
  const passo = [0.05, 0.1, 0.25, 0.5, 1, 2, 5].find(s => (b - a) / s <= 6) || 5;

  const ticks = []; for (let t = a; t <= b + 1e-9; t += passo) ticks.push(t);
  return { a, b, ticks };
}

  box.querySelectorAll("svg").forEach(s => s.remove());
  const W = Math.max(box.clientWidth, 320), H = 360, m = { t: 16, r: 18, b: 34, l: 58 };
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Gráfico da Selic" });
  box.prepend(svg);
  const vals = ps.map(p => p.v), { a, b, ticks } = eixoY(Math.min(...vals), Math.max(...vals));
  const t0 = ps[0].d.getTime(), t1 = Math.max(ps[ps.length - 1].d.getTime(), t0 + 864e5);
  const x = d => m.l + (d.getTime() - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = v => m.t + (b - v) / (b - a) * (H - m.t - m.b);
  for (const t of ticks) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: "#E6E8EE" }, svg);
    el("text", { x: m.l - 10, y: y(t) + 4, "text-anchor": "end", "font-size": 12, fill: "#6B7080" }, svg).textContent = br(t);
  }
  const dias = (t1 - t0) / 864e5, rotulos = [];
  const cursor = new Date(ps[0].d.getFullYear(), ps[0].d.getMonth() + 1, 1);
  const pulo = dias > 1100 ? 12 : dias > 400 ? 2 : 1;
  for (let c = new Date(cursor); c <= ps[ps.length - 1].d; c.setMonth(c.getMonth() + pulo)) rotulos.push(new Date(c));
  if (dias <= 45) { rotulos.length = 0; ps.forEach((p, i) => { if (i % Math.ceil(ps.length / 6) === 0) rotulos.push(p.d); }); }
  for (const r of rotulos) {
    el("line", { x1: x(r), x2: x(r), y1: H - m.b, y2: H - m.b + 5, stroke: "#9AA0AE" }, svg);
    el("text", { x: x(r), y: H - m.b + 20, "text-anchor": "middle", "font-size": 12, fill: "#6B7080" }, svg)
      .textContent = dias <= 45 ? r.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) : mesBR(r);
  }
  let d = `M${x(ps[0].d)},${y(ps[0].v)}`;
  for (let i = 1; i < ps.length; i++) d += `H${x(ps[i].d)}V${y(ps[i].v)}`;
  const grad = el("linearGradient", { id: "g", x1: 0, y1: 0, x2: 0, y2: 1 }, el("defs", {}, svg));
  el("stop", { offset: "0", "stop-color": "#2B63DF", "stop-opacity": .22 }, grad);
  el("stop", { offset: "1", "stop-color": "#2B63DF", "stop-opacity": 0 }, grad);
  el("path", { d: d + `V${H - m.b}H${x(ps[0].d)}Z`, fill: "url(#g)" }, svg);
  el("path", { d, fill: "none", stroke: "#2B63DF", "stroke-width": 2.5 }, svg);
  for (const md of muds) {
    el("circle", { cx: x(md.d), cy: y(md.para), r: 5.5, fill: "#F37522", stroke: "#fff", "stroke-width": 2 }, svg);
    const perto = x(md.d) > W - m.r - 50;
    if (muds.length <= 15) el("text", { x: x(md.d) + (perto ? -9 : 9), y: y(md.para) - 9, "text-anchor": perto ? "end" : "start", "font-size": 12, "font-weight": 600, fill: "#1B172D" }, svg)
      .textContent = br(md.para);
  }
  const ult = ps[ps.length - 1];
  el("circle", { cx: x(ult.d), cy: y(ult.v), r: 6, fill: "#1B172D", stroke: "#fff", "stroke-width": 2 }, svg);
  const guia = el("line", { y1: m.t, y2: H - m.b, stroke: "#1B172D", "stroke-dasharray": "3 3", opacity: 0 }, svg);
  const alvo = el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" }, svg);
  const dica = document.getElementById("dica");
  alvo.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect(), px = ev.clientX - r.left;
    const tt = t0 + (px - m.l) / (W - m.l - m.r) * (t1 - t0);
    let p = ps[0]; for (const q of ps) { if (q.d.getTime() <= tt) p = q; else break; }
    guia.setAttribute("x1", x(p.d)); guia.setAttribute("x2", x(p.d)); guia.setAttribute("opacity", .5);
    dica.innerHTML = `${dataBR(p.d)}<br><b>${br(p.v)}% a.a.</b>`;
    dica.style.opacity = 1; dica.style.top = (y(p.v) - 58) + "px";
    dica.style.left = Math.min(Math.max(x(p.d) - 45, 0), W - 110) + "px";
  });
  alvo.addEventListener("mouseleave", () => { dica.style.opacity = 0; guia.setAttribute("opacity", 0); });
}

function comparativo(ps) {
  const ult = ps[ps.length - 1], alvo = new Date(ult.d); alvo.setFullYear(alvo.getFullYear() - 1);
  let ref = null; for (const p of pontos) { if (p.d <= alvo) ref = p; else break; }
  if (!ref && pontos[0].d - alvo < 10 * 864e5) ref = pontos[0];  // série começa ~1 ano atrás
  if (!ref) return "";
  const v = ult.v - ref.v;
  return `<div class="compara"><div class="rot">Há 12 meses (${dataBR(ref.d)})</div><div class="val">${br(ref.v)}%</div>
    <div class="det ${v < 0 ? "neg" : v > 0 ? "pos" : ""}">${v > 0 ? "+" : ""}${br(v)} p.p. até ${dataBR(ult.d)}</div></div>`;
}

function tabela(muds, ps) {
  const alvo = document.getElementById("mudancas");
  if (!muds.length) { alvo.innerHTML = '<div class="vazio">A taxa não mudou no período selecionado.</div>' + comparativo(ps); return; }
  alvo.innerHTML = "<table><tr><th>Data</th><th style='text-align:right'>De</th><th style='text-align:right'>Para</th><th style='text-align:right'>Variação</th></tr>" +
    muds.slice().reverse().map(md => {
      const v = md.para - md.de, c = v < 0 ? "neg" : "pos";
      return `<tr><td>${dataBR(md.d)}</td><td class="num">${br(md.de)}%</td><td class="num">${br(md.para)}%</td><td class="num ${c}">${v > 0 ? "+" : ""}${br(v)} p.p.</td></tr>`;
    }).join("") + "</table>" + comparativo(ps);
}

function mensal(ps) {
  const box = document.getElementById("mensal"); box.innerHTML = "";
  const grupos = new Map();
  for (const p of ps) { const k = p.d.getFullYear() * 12 + p.d.getMonth(); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(p.v); }
  const meses = [...grupos].map(([k, vs]) => ({ d: new Date(Math.floor(k / 12), k % 12, 1), v: vs.reduce((a, b) => a + b, 0) / vs.length }));
  const W = Math.max(box.clientWidth, 320), H = 230, m = { t: 26, r: 10, b: 30, l: 10 };
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Média mensal da Selic" }, box);
  const vals = meses.map(x => x.v), { a, b, ticks } = eixoY(Math.min(...vals), Math.max(...vals));
  m.l = 58;
  const passo = (W - m.l - m.r) / meses.length;
  const cx = i => m.l + passo * (i + 0.5), cy = v => m.t + (b - v) / (b - a) * (H - m.t - m.b);
  for (const t of ticks) {
    el("line", { x1: m.l, x2: W - m.r, y1: cy(t), y2: cy(t), stroke: "#E6E8EE" }, svg);
    el("text", { x: m.l - 10, y: cy(t) + 4, "text-anchor": "end", "font-size": 12, fill: "#6B7080" }, svg).textContent = br(t);
  }
  el("polyline", { points: meses.map((mm, i) => `${cx(i)},${cy(mm.v)}`).join(" "), fill: "none", stroke: "#253E8C", "stroke-width": 2 }, svg);
  const mostrarRotulo = meses.length <= 24;
  meses.forEach((mm, i) => {
    const ultimo = i === meses.length - 1;
    el("circle", { cx: cx(i), cy: cy(mm.v), r: ultimo ? 7 : 5.5, fill: ultimo ? "#F37522" : "#253E8C", stroke: "#fff", "stroke-width": 2 }, svg);
    if (mostrarRotulo) el("text", { x: cx(i), y: cy(mm.v) - 12, "text-anchor": "middle", "font-size": 11.5, "font-weight": 600, fill: "#1B172D" }, svg).textContent = br(mm.v);
    if (mostrarRotulo || mm.d.getMonth() === 0) el("text", { x: cx(i), y: H - 10, "text-anchor": "middle", "font-size": 11.5, fill: "#6B7080" }, svg).textContent = mesBR(mm.d);
  });
}

function aplicar(de, ate) {
  let ps = filtrar(de, ate);
  if (ps.length < 2) ps = pontos.slice(-2);
  inDe.value = iso(ps[0].d); inAte.value = iso(ps[ps.length - 1].d);
  document.getElementById("sub").textContent =
    `${dataBR(ps[0].d)} a ${dataBR(ps[ps.length - 1].d)} · série 1178 do Banco Central (Selic anualizada base 252)`;
  const muds = mudancas(ps);
  kpis(ps, muds); grafico(ps, muds); tabela(muds, ps); mensal(ps);
  window._atual = [de, ate];
}

document.querySelectorAll("#filtros button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#filtros button").forEach(x => x.classList.remove("ativo")); b.classList.add("ativo");
  const n = +b.dataset.meses, de = new Date(ultimaData);
  if (n) de.setMonth(de.getMonth() - n); else de.setTime(primeiraData.getTime());
  aplicar(de, ultimaData);
}));
for (const i of [inDe, inAte]) i.addEventListener("change", () => {
  document.querySelectorAll("#filtros button").forEach(x => x.classList.remove("ativo"));
  aplicar(new Date(inDe.value + "T00:00:00"), new Date(inAte.value + "T00:00:00"));
});
window.addEventListener("resize", () => aplicar(...window._atual));
document.querySelector('#filtros button[data-meses="0"]').classList.add("ativo");
aplicar(primeiraData, ultimaData);
</script>
</body>
</html>
